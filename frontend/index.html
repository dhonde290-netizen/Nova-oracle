<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Oracle</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="stars"></div>
    <div class="container" id="main-container">
        <div class="header" id="header">
            <h1 class="glitch" data-text="NOVA ORACLE">NOVA ORACLE</h1>
            <p class="subtitle">Seek the wisdom of the cloud</p>
        </div>
        
        <div id="chat-history" class="chat-history">
            <!-- Messages will appear here -->
        </div>

        <div id="loading" class="hidden">
            <div class="orb"></div>
            <p>Consulting the void...</p>
        </div>

        <div class="input-wrapper" id="input-wrapper">
            <textarea id="prompt-input" placeholder="Ask your question..." rows="1" autofocus></textarea>
            <button id="submit-btn">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
